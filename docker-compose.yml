services:
  mysql:
    # Keep the database engine version deterministic. Upgrade it only after a
    # verified logical backup, never implicitly during an application update.
    image: mysql:8.0.46
    container_name: glpi_db
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      - MYSQL_ROOT_PASSWORD=Ativ@Adm2026
      - MYSQL_DATABASE=glpidb
      - MYSQL_USER=glpiuser
      - MYSQL_PASSWORD=Ativ@Adm2026
    command:
      # The whole database (~305 MB) must fit in memory. The default 128 MB
      # forced constant disk reads under the agents' traffic.
      - --innodb-buffer-pool-size=512M
      # Binary logs are only for replication/point-in-time recovery, and
      # neither is used (backup.sh uses mysqldump). They doubled every write.
      - --skip-log-bin
      # Flush the redo log to disk once per second instead of on every
      # commit. An OS crash or power loss may lose up to ~1 s of changes.
      - --innodb-flush-log-at-trx-commit=2
    volumes:
      # Database files live outside the Git working tree. A git pull can no
      # longer replace or delete InnoDB redo logs.
      - glpi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
 
  glpi:
    image: diouxx/glpi:latest
    container_name: glpi_web
    restart: always
    ports:
      - "8443:443"
    entrypoint: ["/opt/glpi-start-ssl.sh"]
    environment:
      - TIMEZONE=America/Sao_Paulo
    volumes:
      - ./glpi_data:/var/www/html/glpi
      - ./default-ssl.conf:/etc/apache2/sites-available/default-ssl.conf:ro
      - ./start-glpi-ssl.sh:/opt/glpi-start-ssl.sh:ro
      - /etc/letsencrypt/live/ad.ativalocacao.com.br/fullchain.pem:/etc/ssl/certs/glpi.crt:ro
      - /etc/letsencrypt/live/ad.ativalocacao.com.br/privkey.pem:/etc/ssl/private/glpi.key:ro
    depends_on:
      mysql:
        condition: service_healthy

  portal_registro:
    build: ./portal-ativa
    container_name: portal_ativa
    ports:
      - "5000:5000"
    restart: always
    depends_on:
      - glpi # (Coloque aqui o nome exato do seu container do GLPI)

  # Ativa Remote: servidor RustDesk proprio (hbbs = rendezvous/ID, hbbr =
  # relay). Usado pelos computadores e pelo app Ativa Remote T.I., pela rede
  # da empresa e pela VPN (nao abra estas portas para a internet). Sobe sem
  # mexer no GLPI:  docker compose up -d rustdesk_hbbs rustdesk_hbbr
  # A chave publica (para Ativa Remote > Configuracoes) fica em
  # ./rustdesk_data/id_ed25519.pub. A chave privada nunca sai deste servidor.
  # RUSTDESK_BIND_IP (no .env): IP da rede interna/VPN deste servidor, para as
  # portas so escutarem ali.
  rustdesk_hbbs:
    image: rustdesk/rustdesk-server:1.1.15
    container_name: rustdesk_hbbs
    # -k _ : so aceita clientes com a chave deste servidor.
    command: hbbs -k _
    ports:
      - "${RUSTDESK_BIND_IP:-0.0.0.0}:21115:21115"
      - "${RUSTDESK_BIND_IP:-0.0.0.0}:21116:21116"
      - "${RUSTDESK_BIND_IP:-0.0.0.0}:21116:21116/udp"
    volumes:
      - ./rustdesk_data:/root
    depends_on:
      - rustdesk_hbbr
    restart: unless-stopped

  rustdesk_hbbr:
    image: rustdesk/rustdesk-server:1.1.15
    container_name: rustdesk_hbbr
    command: hbbr -k _
    ports:
      - "${RUSTDESK_BIND_IP:-0.0.0.0}:21117:21117"
    volumes:
      - ./rustdesk_data:/root
    restart: unless-stopped

volumes:
  glpi_mysql_data:
    name: glpi_mysql_data
