<VirtualHost *:443>
        DocumentRoot /var/www/html/glpi/public

        <Directory /var/www/html/glpi/public>
                Require all granted
                # The GLPI and Ativa Wallpaper APIs authenticate clients with
                # the Authorization header. Apache hides it from CGI/FastCGI
                # applications by default unless this directive is enabled.
                CGIPassAuth On
                RewriteEngine On
                RewriteCond %{REQUEST_FILENAME} !-f
                RewriteRule ^(.*)$ index.php [QSA,L]
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/error-ssl-glpi.log
        CustomLog ${APACHE_LOG_DIR}/access-ssl-glpi.log combined

        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/glpi.crt
        SSLCertificateKeyFile /etc/ssl/private/glpi.key
</VirtualHost>
