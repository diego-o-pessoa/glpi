<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 420" role="img" aria-labelledby="t">
  <title id="t">Sala principal - Anexo (vista de cima)</title>
  <defs>
    <pattern id="tiles" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#fbfaf6"/>
      <path d="M30 0H0V30" fill="none" stroke="#ece8de" stroke-width="1"/>
    </pattern>
    <pattern id="plants" width="22" height="14" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="7" r="5" fill="#86c58f"/>
      <circle cx="16" cy="6" r="4" fill="#5fae6b"/>
    </pattern>
  </defs>

  <!-- Jardineira externa (lado da rua) -->
  <rect x="70" y="378" width="1640" height="16" rx="8" fill="url(#plants)" opacity="0.8"/>

  <!-- Piso -->
  <path d="M40 88H520V60H1720V360H40Z" fill="url(#tiles)"/>

  <!-- Armarios (direita) -->
  <g>
    <rect x="1652" y="150" width="64" height="206" rx="3" fill="#94a3b8"/>
    <path d="M1652 219H1716M1652 288H1716" stroke="#64748b" stroke-width="3"/>
    <text x="1684" y="253" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle" transform="rotate(-90 1684 253)">ARMÁRIOS</text>
  </g>

  <!-- Impressora -->
  <g>
    <rect x="1588" y="68" width="52" height="26" rx="3" fill="#cbd5e1" stroke="#94a3b8"/>
    <rect x="1600" y="74" width="28" height="14" rx="2" fill="#475569"/>
    <text x="1614" y="110" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Impressora</text>
  </g>

  <!-- Paredes -->
  <path d="M40 88H520V60H1720V360H40Z" fill="none" stroke="#334155" stroke-width="8" stroke-linejoin="round"/>

  <!-- Janelas (parede de cima) -->
  <g stroke="#7fb3e6" stroke-width="8" stroke-linecap="butt">
    <path d="M110 88H240M270 88H400M420 88H500"/>
    <path d="M560 60H690M712 60H842M864 60H994M1016 60H1146M1168 60H1298M1320 60H1450M1472 60H1560"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.5">
    <path d="M110 88H240M270 88H400M420 88H500"/>
    <path d="M560 60H690M712 60H842M864 60H994M1016 60H1146M1168 60H1298M1320 60H1450M1472 60H1560"/>
  </g>

  <!-- Divisoria de vidro (parede esquerda) -->
  <path d="M40 130V262" stroke="#7fb3e6" stroke-width="8"/>
  <path d="M40 130V262" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Porta (parede esquerda; dobradica embaixo, perto do canto; abre para dentro e para cima) -->
  <path d="M40 292V348" stroke="#fbfaf6" stroke-width="10"/>
  <path d="M40 346H94" stroke="#334155" stroke-width="3"/>
  <path d="M94 346A54 54 0 0 0 40 292" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Ao lado da porta, fora do arco -->
  <text x="102" y="334" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">Entrada</text>
</svg>
